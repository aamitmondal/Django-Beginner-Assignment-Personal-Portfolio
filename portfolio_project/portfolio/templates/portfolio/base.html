{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Amit Mondal Portfolio
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{% static 'portfolio/style.css' %}">

</head>

<body>

    <nav class="navbar">

        <div class="container">

            <a href="{% url 'home' %}" class="logo">
                Amit Mondal
            </a>

            <div class="nav-links">

                <a href="{% url 'home' %}">
                    Home
                </a>

                <a href="{% url 'projects' %}">
                    Projects
                </a>

                <a href="{% url 'about' %}">
                    About
                </a>

            </div>

        </div>

    </nav>


    <main>

        {% block content %}
        {% endblock %}

    </main>


    <footer class="footer">

        <p>
            © 2026 Amit Mondal. All Rights Reserved.
        </p>

    </footer>

</body>

</html>
